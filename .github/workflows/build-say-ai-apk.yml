name: Build SAY AI Android APK

on:
  push:
    branches:
      - build-say-ai-android-apk
    paths:
      - '.github/workflows/build-say-ai-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest SAY AI app code
        uses: actions/checkout@v4
        with:
          ref: fix/say-ai-google-login-logo

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create Android WebView app
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/trofficial/sayai
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SAYAI"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.trofficial.sayai'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.trofficial.sayai'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <path android:fillColor="#080B1C" android:pathData="M0,0h100v100h-100z" />
              <path android:fillColor="#00000000" android:strokeColor="#D946EF"
                  android:strokeWidth="9" android:strokeLineCap="round"
                  android:pathData="M50,10 C72,10 90,28 90,50 C90,68 76,84 58,88 C42,92 26,82 20,68 C14,54 20,38 32,30 C44,22 60,26 66,38 C72,50 66,64 54,68 C44,72 34,66 32,56 C30,48 36,42 44,42 C50,42 54,46 54,50" />
              <path android:fillColor="#00000000" android:strokeColor="#38BDF8"
                  android:strokeWidth="6" android:strokeLineCap="round"
                  android:pathData="M50,90 C28,90 10,72 10,50 C10,32 24,16 42,12 C58,8 74,18 80,32 C86,46 80,62 68,70 C56,78 40,74 34,62" />
              <path android:fillColor="#FFFFFF" android:pathData="M57,50 A7,7 0,1 1,43 50 A7,7 0,1 1,57 50" />
              <path android:fillColor="#A855F7" android:pathData="M54,50 A4,4 0,1 1,46 50 A4,4 0,1 1,54 50" />
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="SAY AI"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize"
                      android:launchMode="singleTop"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.trofficial.sayai" android:host="login-callback" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/trofficial/sayai/MainActivity.java <<'EOF'
          package com.trofficial.sayai;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              private WebView webView;
              private String pendingOAuthCode;
              private String pendingOAuthError;
              private int oauthDeliveryAttempts = 0;

              public class SayAiBridge {
                  @JavascriptInterface
                  public void openExternal(String url) {
                      if (url == null || !(url.startsWith("https://"))) return;
                      runOnUiThread(() -> {
                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          startActivity(intent);
                      });
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  webView.addJavascriptInterface(new SayAiBridge(), "SayAiAndroid");
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          deliverPendingOAuthCode();
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String host = request.getUrl().getHost();
                          if (host == null) return true;
                          boolean trusted = host.equals("say-ai.pages.dev")
                              || host.equals("supabase.co") || host.endsWith(".supabase.co");
                          return !trusted;
                      }
                  });
                  setContentView(webView);
                  if (savedInstanceState == null) {
                      webView.loadUrl("https://say-ai.pages.dev");
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
                  handleOAuthReturn(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleOAuthReturn(intent);
              }

              private void handleOAuthReturn(Intent intent) {
                  Uri uri = intent == null ? null : intent.getData();
                  if (uri == null || !"com.trofficial.sayai".equals(uri.getScheme())
                      || !"login-callback".equals(uri.getHost())) return;
                  String code = uri.getQueryParameter("code");
                  String error = uri.getQueryParameter("error_description");
                  if (error == null) error = uri.getQueryParameter("error");
                  if ((code == null || code.isEmpty()) && (error == null || error.isEmpty())) return;
                  pendingOAuthCode = code == null ? "" : code;
                  pendingOAuthError = error;
                  oauthDeliveryAttempts = 0;
                  deliverPendingOAuthCode();
              }

              private void deliverPendingOAuthCode() {
                  if (pendingOAuthCode == null || webView == null) return;
                  String quotedCode = JSONObject.quote(pendingOAuthCode);
                  String quotedError = JSONObject.quote(pendingOAuthError == null ? "" : pendingOAuthError);
                  webView.evaluateJavascript(
                      "(function(){if(typeof window.handleSayAiGoogleCallback==='function'){window.handleSayAiGoogleCallback("
                          + quotedCode + "," + quotedError + ");return 'sent';}return 'wait';})()",
                      result -> {
                          if ("\"sent\"".equals(result)) {
                              pendingOAuthCode = null;
                              pendingOAuthError = null;
                          } else if (oauthDeliveryAttempts++ < 120 && webView != null) {
                              webView.postDelayed(this::deliverPendingOAuthCode, 250);
                          }
                      });
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  deliverPendingOAuthCode();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SAY-AI-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
