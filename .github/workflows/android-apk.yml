name: Build SAY AI Android APK
# Rebuild after the latest mobile API and launcher icon fixes

on:
  push:
    branches: [main, android-apk-fix]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'src/**'
      - 'functions/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'resources/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'src/**'
      - 'functions/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'capacitor.config.json'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://ssfxkcylqrmdrkacpive.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_DjReYEEXsJKQSkPFqf7GCQ_IlikKpDf
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Update Bun lockfile for Capacitor dependencies
        run: |
          bun install
          git add bun.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Bun lockfile for Android build"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Type-check application UI
        run: npx tsc --noEmit --skipLibCheck --strict false --jsx react-jsx --target ES2022 --module ESNext --moduleResolution bundler --types vite/client --ignoreConfig src/App.tsx
      - name: Build SAY AI web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Install approved SAY AI launcher icon
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip pillow cairosvg
          .venv/bin/python scripts/install-android-icon.py
      - name: Copy transparent SAY AI logo into web assets
        run: cp resources/say-ai-logo.png public/assets/say-ai-logo.png
      - name: Register Google sign-in callback
        run: node scripts/patch-android-manifest.mjs
      - name: Sync Capacitor plugins
        run: npx cap sync android
      - name: Build installable APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAY-AI-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish Android build status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'SAY AI Android APK build',
              description: state === 'success' ? 'APK built and uploaded as an artifact' : 'Android APK build failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
