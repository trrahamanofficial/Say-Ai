name: Build SAY AI Android APK

on:
  push:
    branches: [android-apk-fix]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'src/**'
      - 'functions/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://ssfxkcylqrmdrkacpive.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_DjReYEEXsJKQSkPFqf7GCQ_IlikKpDf
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Update Bun lockfile for Capacitor dependencies
        run: |
          bun install
          git add bun.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Bun lockfile for Android build"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build SAY AI web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Register Google sign-in callback
        run: node scripts/patch-android-manifest.mjs
      - name: Sync Capacitor plugins
        run: npx cap sync android
      - name: Build installable APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAY-AI-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
