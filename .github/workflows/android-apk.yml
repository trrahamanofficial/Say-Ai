name: Build SAY AI Android APK

on:
  push:
    branches: [android-apk-fix]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'src/**'
      - 'functions/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Verify required Supabase build settings
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "Missing GitHub secret VITE_SUPABASE_URL" && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo "Missing GitHub secret VITE_SUPABASE_ANON_KEY" && exit 1)
      - name: Install dependencies
        run: npm install
      - name: Build SAY AI web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Register Google sign-in callback
        run: node scripts/patch-android-manifest.mjs
      - name: Sync Capacitor plugins
        run: npx cap sync android
      - name: Build installable APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAY-AI-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
