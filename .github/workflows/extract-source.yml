name: Extract SAY AI ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP
        run: |
          unzip -o SAY-AI-GITHUB-SOURCE-ROOT.zip -d .
          test -f package.json

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Extract SAY AI source [skip ci]" && git push)
