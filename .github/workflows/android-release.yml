name: Build and publish signed SAY AI release APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release.yml'
      - 'src/App.tsx'
      - 'src/components/AppUpdatePrompt.tsx'
      - 'src/components/VideoGenView.tsx'
      - 'src/components/ChatView.tsx'
      - 'src/components/AuthView.tsx'
      - 'src/components/ImageGenView.tsx'
      - 'src/lib/supabase.ts'
      - 'src/lib/api.ts'
      - 'src/types.ts'
      - 'functions/**'
      - 'scripts/configure-android-release.mjs'
      - 'scripts/install-android-icon.py'
      - 'scripts/patch-android-manifest.mjs'
      - 'package.json'
      - 'capacitor.config.json'
      - 'resources/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_SUPABASE_URL: https://ssfxkcylqrmdrkacpive.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_DjReYEEXsJKQSkPFqf7GCQ_IlikKpDf
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Resolve Bun dependencies
        run: bun install
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Type-check application UI
        run: npx tsc --noEmit --skipLibCheck --strict false --jsx react-jsx --target ES2022 --module ESNext --moduleResolution bundler --types vite/client --ignoreConfig src/App.tsx
      - name: Build SAY AI web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Install approved SAY AI launcher icon
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip pillow cairosvg
          .venv/bin/python scripts/install-android-icon.py
      - name: Register Google sign-in callback
        run: node scripts/patch-android-manifest.mjs
      - name: Sync Capacitor plugins
        run: npx cap sync android
      - name: Configure persistent release signing
        run: node scripts/configure-android-release.mjs
      - name: Build signed release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Rename release APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SAY-AI-v1.0.1.apk
      - name: Create stable latest APK download name
        run: cp SAY-AI-v1.0.1.apk SAY-AI-latest.apk
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAY-AI-Android-signed-release-APK-v1.0.1
          path: |
            SAY-AI-v1.0.1.apk
            SAY-AI-latest.apk
          retention-days: 14
      - name: Publish signed APK as GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.1
          name: SAY AI 1.0.1
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            SAY-AI-v1.0.1.apk
            SAY-AI-latest.apk
