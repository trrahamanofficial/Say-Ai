name: Build SAY AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-cloudflare-release
    paths:
      - '.github/workflows/build-say-ai-android.yml'
      - 'capacitor.config.ts'
      - 'capacitor.config.json'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Install Capacitor Android tooling
        run: npm install --legacy-peer-deps --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Add Android platform and sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAY-AI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
